<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="用原生 Canvas 实现的贪吃蛇小游戏，支持键盘、方向键与手机滑动操作。">
<title>贪吃蛇 · Snake</title>
<style>
  :root{
    --primary:#F3A04C;--accent:#E58522;--background:#F4F4F6;--card-bg:#fff;
    --text-primary:rgba(0,0,0,.8);--text-secondary:rgba(0,0,0,.5);--text-tertiary:rgba(0,0,0,.35);
    --intensity-4:rgba(0,0,0,.04);--intensity-6:rgba(0,0,0,.06);--intensity-8:rgba(0,0,0,.08);
    --intensity-12:rgba(0,0,0,.12);--input-shadow:rgba(0,0,0,.08);--primary-foreground:#fff;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --background:#232324;--card-bg:#2E2E2E;--primary-foreground:#000;
      --text-primary:rgba(255,255,255,.8);--text-secondary:rgba(255,255,255,.5);
      --text-tertiary:rgba(255,255,255,.35);--intensity-4:rgba(255,255,255,.04);
      --intensity-6:rgba(255,255,255,.06);--intensity-8:rgba(255,255,255,.08);
      --intensity-12:rgba(255,255,255,.12);--input-shadow:rgba(0,0,0,.28);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:var(--background);color:var(--text-primary);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  button{font-family:inherit;cursor:pointer}
  .game{width:100%;max-width:640px}
  .ghead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .gtitle{font-size:17px;font-weight:500;line-height:1.2}
  .gsub{font-size:12px;color:var(--text-secondary);margin-top:4px}
  .pills{display:flex;gap:2px;background:var(--intensity-4);border:.5px solid var(--intensity-6);border-radius:10px;padding:3px}
  .pill{height:26px;padding:0 10px;border:0;background:transparent;color:var(--text-secondary);font-size:12px;font-weight:500;border-radius:8px;transition:background .15s,color .15s}
  .pill:hover{color:var(--text-primary)}
  .pill[aria-pressed="true"]{background:var(--card-bg);color:var(--text-primary);box-shadow:0 1px 2px var(--input-shadow)}
  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
  .stat{background:var(--intensity-4);border-radius:10px;padding:10px 12px;min-width:0}
  .stat .k{font-size:11px;color:var(--text-secondary);margin-bottom:5px}
  .stat .v{font-size:20px;line-height:1;font-weight:500;font-variant-numeric:tabular-nums}
  .main{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
  .boardcol{flex:1 1 260px;min-width:0;max-width:380px}
  .board-wrap{position:relative;padding:10px;background:var(--card-bg);border:.5px solid var(--intensity-8);border-radius:18px}
  canvas#board{display:block;width:100%;height:auto;border-radius:11px;touch-action:none}
  .overlay{position:absolute;inset:10px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;text-align:center;background:var(--card-bg)}
  .overlay.hide{display:none}
  .ov-t{font-size:15px;font-weight:500}
  .ov-s{font-size:12px;color:var(--text-secondary);line-height:1.55;max-width:210px}
  .ov-btn{margin-top:6px;height:36px;padding:0 16px;border:0;border-radius:10px;background:var(--primary);color:var(--primary-foreground);font-size:12px;font-weight:500;transition:background .15s}
  .ov-btn:hover{background:var(--accent)}
  .side{flex:1 1 176px;min-width:168px;display:flex;flex-direction:column;gap:12px}
  .row{display:flex;gap:8px}
  .btn{height:36px;border-radius:10px;font-size:12px;font-weight:500;transition:background .15s,border-color .15s}
  .btn-primary{background:var(--primary);color:var(--primary-foreground);border:0}
  .btn-primary:hover{background:var(--accent)}
  .btn-ghost{background:var(--intensity-4);color:var(--text-primary);border:.5px solid var(--intensity-8)}
  .btn-ghost:hover{background:var(--intensity-8)}
  .dpad{display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(2,40px);gap:6px;justify-content:center}
  .dpad button{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:.5px solid var(--intensity-8);border-radius:10px;background:var(--intensity-4);color:var(--text-secondary);font-size:15px;transition:background .15s,color .15s}
  .dpad button:hover{background:var(--intensity-8);color:var(--text-primary)}
  .dpad button:active{background:var(--intensity-12)}
  .dpad [data-dir="up"]{grid-area:1/2}
  .dpad [data-dir="left"]{grid-area:2/1}
  .dpad [data-dir="down"]{grid-area:2/2}
  .dpad [data-dir="right"]{grid-area:2/3}
  .hint{font-size:11px;line-height:1.6;color:var(--text-tertiary);text-align:center}
</style>
</head>
<body>
<div class="game">
  <div class="ghead">
    <div>
      <div class="gtitle">贪吃蛇</div>
      <div class="gsub">20 × 20 经典街机</div>
    </div>
    <div class="pills" role="group" aria-label="速度">
      <button class="pill" type="button" data-speed="170" aria-pressed="false">慢</button>
      <button class="pill" type="button" data-speed="120" aria-pressed="true">标准</button>
      <button class="pill" type="button" data-speed="80" aria-pressed="false">快</button>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><div class="k">分数</div><div class="v" id="score">0</div></div>
    <div class="stat"><div class="k">最高分</div><div class="v" id="best">0</div></div>
    <div class="stat"><div class="k">长度</div><div class="v" id="len">3</div></div>
  </div>
  <div class="main">
    <div class="boardcol">
      <div class="board-wrap">
        <canvas id="board" width="640" height="640" aria-label="贪吃蛇棋盘"></canvas>
        <div class="overlay" id="overlay">
          <div class="ov-t" id="ovTitle">准备开始</div>
          <div class="ov-s" id="ovSub">用方向键或下方按键控制方向，吃掉橙色圆点</div>
          <button class="ov-btn" type="button" id="ovBtn">开始游戏</button>
        </div>
      </div>
    </div>
    <div class="side">
      <div class="row">
        <button class="btn btn-primary" type="button" id="pauseBtn" style="flex:1">暂停</button>
        <button class="btn btn-ghost" type="button" id="resetBtn" style="flex:1">重开</button>
      </div>
      <div class="dpad" role="group" aria-label="方向控制">
        <button type="button" data-dir="up" aria-label="上">&#8593;</button>
        <button type="button" data-dir="left" aria-label="左">&#8592;</button>
        <button type="button" data-dir="down" aria-label="下">&#8595;</button>
        <button type="button" data-dir="right" aria-label="右">&#8594;</button>
      </div>
      <div class="hint">方向键 / WASD 转向<br>空格 暂停或继续</div>
    </div>
  </div>
</div>
<script>
(function(){
  var COLS = 20, ROWS = 20;
  var cvs = document.getElementById('board');
  var ctx = cvs.getContext('2d');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var lenEl = document.getElementById('len');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovSub = document.getElementById('ovSub');
  var ovBtn = document.getElementById('ovBtn');
  var pauseBtn = document.getElementById('pauseBtn');
  var resetBtn = document.getElementById('resetBtn');
  var speedBtns = Array.prototype.slice.call(document.querySelectorAll('.pill'));
  var dpadBtns = Array.prototype.slice.call(document.querySelectorAll('[data-dir]'));

  var S = {
    snake: [], dir: { x: 1, y: 0 }, queue: [], food: { x: 14, y: 10 },
    score: 0, best: 0, record: false, phase: 'idle', speed: 120, acc: 0
  };
  var cssW = 320, cell = 16;

  function isDark(){ return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }
  function colors(){
    if (isDark()) return { board:'#26262A', grid:'rgba(255,255,255,0.045)', head:'#57C55A', body:'86,199,90', food:'#F3A04C', halo:'rgba(243,160,76,0.16)', eye:'#1A1A1B' };
    return { board:'#F7F8F9', grid:'rgba(0,0,0,0.04)', head:'#3FAE43', body:'64,180,62', food:'#E58522', halo:'rgba(229,133,34,0.14)', eye:'#FFFFFF' };
  }

  function rr(x, y, w, h, r){
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.lineTo(x+w-r, y);
    ctx.arcTo(x+w, y, x+w, y+r, r);
    ctx.lineTo(x+w, y+h-r);
    ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
    ctx.lineTo(x+r, y+h);
    ctx.arcTo(x, y+h, x, y+h-r, r);
    ctx.lineTo(x, y+r);
    ctx.arcTo(x, y, x+r, y, r);
    ctx.closePath();
  }

  function fit(){
    var rect = cvs.getBoundingClientRect();
    var w = Math.max(160, Math.min(rect.width || 320, 380));
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var px = Math.round(w * dpr);
    if (cvs.width !== px || cvs.height !== px) { cvs.width = px; cvs.height = px; }
    cssW = px / dpr;
    cell = cssW / COLS;
    draw();
  }

  function draw(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var W = cssW, p = colors();

    ctx.clearRect(0, 0, W, W);
    ctx.fillStyle = p.board;
    ctx.fillRect(0, 0, W, W);

    ctx.strokeStyle = p.grid;
    ctx.lineWidth = 1;
    for (var i = 1; i < COLS; i++) {
      var v = Math.round(i * cell) + 0.5;
      ctx.beginPath(); ctx.moveTo(v, 0); ctx.lineTo(v, W); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, v); ctx.lineTo(W, v); ctx.stroke();
    }

    var t = performance.now();
    var pulse = 1 + Math.sin(t / 260) * 0.07;
    var fx = (S.food.x + 0.5) * cell, fy = (S.food.y + 0.5) * cell, fr = cell * 0.3 * pulse;
    ctx.fillStyle = p.halo;
    ctx.beginPath(); ctx.arc(fx, fy, fr + cell * 0.16, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = p.food;
    ctx.beginPath(); ctx.arc(fx, fy, fr, 0, Math.PI * 2); ctx.fill();

    var n = S.snake.length;
    for (var j = n - 1; j >= 1; j--) {
      var seg = S.snake[j];
      var a = 0.3 + 0.58 * (1 - j / Math.max(1, n));
      ctx.fillStyle = 'rgba(' + p.body + ',' + a.toFixed(3) + ')';
      rr(seg.x * cell + 1.5, seg.y * cell + 1.5, cell - 3, cell - 3, Math.min(6, cell * 0.32));
      ctx.fill();
    }

    if (n) {
      var head = S.snake[0];
      ctx.fillStyle = p.head;
      rr(head.x * cell + 1, head.y * cell + 1, cell - 2, cell - 2, Math.min(7, cell * 0.36));
      ctx.fill();

      var d = S.dir;
      var cx = (head.x + 0.5) * cell, cy = (head.y + 0.5) * cell;
      var fwd = cell * 0.13, off = cell * 0.19, rad = Math.max(1.3, cell * 0.085);
      var ex = cx + d.x * fwd, ey = cy + d.y * fwd;
      var ox = d.x !== 0 ? 0 : off, oy = d.x !== 0 ? off : 0;
      ctx.fillStyle = p.eye;
      ctx.beginPath(); ctx.arc(ex + ox, ey + oy, rad, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex - ox, ey - oy, rad, 0, Math.PI * 2); ctx.fill();
    }
  }

  function spawnFood(){
    var free = [];
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        var used = false;
        for (var i = 0; i < S.snake.length; i++) {
          if (S.snake[i].x === x && S.snake[i].y === y) { used = true; break; }
        }
        if (!used) free.push({ x: x, y: y });
      }
    }
    S.food = free.length ? free[Math.floor(Math.random() * free.length)] : { x: 0, y: 0 };
  }

  function reset(){
    S.snake = [{x:8,y:10},{x:7,y:10},{x:6,y:10}];
    S.dir = { x: 1, y: 0 };
    S.queue = [];
    S.score = 0;
    S.record = false;
    S.acc = 0;
    S.phase = 'idle';
    spawnFood();
    syncUI();
    draw();
  }

  function start(){
    if (S.phase === 'over' || S.phase === 'idle') {
      var best = S.best;
      reset();
      S.best = best;
    }
    S.phase = 'running';
    S.acc = 0;
    syncUI();
  }

  function togglePause(){
    if (S.phase === 'running') S.phase = 'paused';
    else if (S.phase === 'paused') { S.phase = 'running'; S.acc = 0; }
    else start();
    syncUI();
  }

  function gameOver(){
    S.phase = 'over';
    S.record = S.score > 0 && S.score >= S.best;
    syncUI();
  }

  function step(){
    if (S.queue.length) S.dir = S.queue.shift();
    var head = S.snake[0];
    var nx = head.x + S.dir.x, ny = head.y + S.dir.y;

    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) { gameOver(); return; }

    var grow = (nx === S.food.x && ny === S.food.y);
    var limit = grow ? S.snake.length : S.snake.length - 1;
    for (var i = 0; i < limit; i++) {
      if (S.snake[i].x === nx && S.snake[i].y === ny) { gameOver(); return; }
    }

    S.snake.unshift({ x: nx, y: ny });
    if (grow) {
      S.score += 10;
      if (S.score > S.best) S.best = S.score;
      spawnFood();
    } else {
      S.snake.pop();
    }
    syncUI();
  }

  function turn(x, y){
    if (S.phase !== 'running') return;
    var ref = S.queue.length ? S.queue[S.queue.length - 1] : S.dir;
    if (ref.x === x && ref.y === y) return;
    if (ref.x === -x && ref.y === -y) return;
    if (S.queue.length < 2) S.queue.push({ x: x, y: y });
  }

  function syncUI(){
    scoreEl.textContent = String(S.score);
    bestEl.textContent = String(S.best);
    lenEl.textContent = String(S.snake.length);
    speedBtns.forEach(function(b){
      b.setAttribute('aria-pressed', Number(b.dataset.speed) === S.speed ? 'true' : 'false');
    });
    pauseBtn.textContent = S.phase === 'running' ? '暂停' : (S.phase === 'paused' ? '继续' : '开始');

    if (S.phase === 'running') { overlay.classList.add('hide'); return; }
    overlay.classList.remove('hide');
    if (S.phase === 'idle') {
      ovTitle.textContent = '准备开始';
      ovSub.textContent = '方向键或下方按键控制方向，吃掉橙色圆点';
      ovBtn.textContent = '开始游戏';
    } else if (S.phase === 'paused') {
      ovTitle.textContent = '已暂停';
      ovSub.textContent = '按空格或点击继续';
      ovBtn.textContent = '继续';
    } else {
      ovTitle.textContent = '游戏结束';
      ovSub.textContent = '本局得分 ' + S.score + (S.record ? ' · 新纪录' : '');
      ovBtn.textContent = '再来一局';
    }
  }

  var lastTs = 0;
  function loop(ts){
    requestAnimationFrame(loop);
    if (!lastTs) lastTs = ts;
    var dt = ts - lastTs;
    lastTs = ts;
    if (dt > 200) dt = 200;
    if (S.phase === 'running') {
      S.acc += dt;
      var guard = 0;
      while (S.acc >= S.speed && guard < 5) {
        guard++;
        S.acc -= S.speed;
        step();
        if (S.phase !== 'running') { S.acc = 0; break; }
      }
    } else {
      S.acc = 0;
    }
    draw();
  }

  ovBtn.addEventListener('click', function(){
    if (S.phase === 'paused') { S.phase = 'running'; S.acc = 0; syncUI(); }
    else start();
  });
  pauseBtn.addEventListener('click', togglePause);
  resetBtn.addEventListener('click', reset);

  speedBtns.forEach(function(b){
    b.addEventListener('click', function(){
      S.speed = Number(b.dataset.speed);
      S.acc = 0;
      syncUI();
    });
  });

  dpadBtns.forEach(function(b){
    b.addEventListener('click', function(){
      var dir = b.dataset.dir;
      if (S.phase === 'idle' || S.phase === 'over') start();
      if (dir === 'up') turn(0, -1);
      if (dir === 'down') turn(0, 1);
      if (dir === 'left') turn(-1, 0);
      if (dir === 'right') turn(1, 0);
    });
  });

  window.addEventListener('keydown', function(e){
    var raw = e.key;
    var k = raw.length === 1 ? raw.toLowerCase() : raw;
    if (k === ' ' || k === 'Spacebar') { e.preventDefault(); togglePause(); return; }
    if (k === 'Enter') {
      if (S.phase !== 'running') { e.preventDefault(); togglePause(); }
      return;
    }
    var map = { arrowup:[0,-1], arrowdown:[0,1], arrowleft:[-1,0], arrowright:[1,0], w:[0,-1], s:[0,1], a:[-1,0], d:[1,0] };
    var mv = map[k];
    if (mv) {
      e.preventDefault();
      if (S.phase === 'idle' || S.phase === 'over') start();
      turn(mv[0], mv[1]);
    }
  });

  var sx = 0, sy = 0, tracking = false;
  cvs.addEventListener('pointerdown', function(e){ tracking = true; sx = e.clientX; sy = e.clientY; });
  cvs.addEventListener('pointerup', function(e){
    if (!tracking) return;
    tracking = false;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.sqrt(dx*dx + dy*dy) < 22) {
      if (S.phase !== 'running') togglePause();
      return;
    }
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
    else turn(0, dy > 0 ? 1 : -1);
  });

  window.addEventListener('resize', fit);

  reset();
  fit();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
